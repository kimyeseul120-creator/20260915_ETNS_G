<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 - ETNS TODO</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container auth-container">
    <header>
        <h1>✅ ETNS TODO</h1>
        <p class="subtitle">회원가입하고 나만의 할 일 목록을 만들어보세요</p>
    </header>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}
    {% endwith %}

    <form class="auth-form" action="{{ url_for('register') }}" method="post">
        <label>아이디
            <input type="text" name="username" autocomplete="username" required>
        </label>
        <label>비밀번호 (4자 이상)
            <input type="password" name="password" autocomplete="new-password" required minlength="4">
        </label>
        <label>비밀번호 확인
            <input type="password" name="password_confirm" autocomplete="new-password" required minlength="4">
        </label>
        <button type="submit">회원가입</button>
    </form>

    <p class="auth-link">이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a></p>
</div>
</body>
</html>
